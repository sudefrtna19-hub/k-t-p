<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta Yapma Oyunu</title>
    <style>
        body {
            background-color: #ffe0b2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Sayfanın kaymasını engeller */
        }
        h1 {
            color: #e65100;
            margin-top: 10px;
            font-size: 1.8em;
        }
        p {
            color: #d84315;
            margin-bottom: 5px;
            font-weight: bold;
        }
        #scoreBoard {
            font-size: 1.5em;
            color: #d81b60;
            font-weight: bold;
            margin-bottom: 10px;
        }
        /* Oyun Alanı */
        #gameArea {
            width: 100%;
            max-width: 400px;
            height: 500px;
            background-color: #fff3e0;
            margin: 0 auto;
            position: relative;
            border: 4px solid #ff9800;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        /* Kâse (Yakalıyıcı) */
        #basket {
            font-size: 40px;
            position: absolute;
            bottom: 20px;
            left: 170px;
            width: 60px;
            height: 60px;
            text-align: center;
            user-select: none;
            transition: left 0.05s linear;
        }
        /* Düşen Nesneler */
        .item {
            font-size: 30px;
            position: absolute;
            top: -40px;
            user-select: none;
        }
        .back-btn {
            display: inline-block;
            background-color: #e65100;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: bold;
            z-index: 10;
            position: relative;
        }
        /* Kazandın Ekranı */
        #winScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #winScreen h2 {
            color: #d81b60;
            font-size: 2em;
        }
        #winScreen .cake {
            font-size: 80px;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <h1>Kuzen İçin Pasta Yap! 🎂</h1>
    <p>Pastaya uygun malzemeleri yakala, kötüleri (🥦🌶️) sakın alma!</p>
    <div id="scoreBoard">Toplanan Malzeme: 0 / 10</div>

    <div id="gameArea">
        <div id="basket">🥣</div>
        
        <!-- Kazandın Ekranı -->
        <div id="winScreen">
            <div class="cake">🎂</div>
            <h2>Pasta Hazır!</h2>
            <p>Mükemmel bir doğum günü pastası yaptın!</p>
            <p>İyi ki doğdun canım kuzenim! 🎉</p>
        </div>
    </div>

    <a href="index.html" class="back-btn">⬅️ Ana Sayfaya Dön</a>

    <script>
        const gameArea = document.getElementById('gameArea');
        const basket = document.getElementById('basket');
        const scoreBoard = document.getElementById('scoreBoard');
        const winScreen = document.getElementById('winScreen');
        
        let score = 0;
        let gameActive = true;
        let fallingItems = [];
        
        // Malzemeler
        const goodItems = ['🍓', '🍫', '🥚', '🥛', '🧈', '🍒'];
        const badItems = ['🥦', '🌶️', '🧄']; // Bunlar skoru düşürür!

        // Kâseyi fare ile hareket ettirme
        gameArea.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            let rect = gameArea.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            // Kâsenin ortalanması için -30px (genişliğin yarısı)
            let newLeft = mouseX - 30; 
            // Kâsenin alanın dışına çıkmasını engelleme
            if (newLeft < 0) newLeft = 0;
            if (newLeft > gameArea.offsetWidth - 60) newLeft = gameArea.offsetWidth - 60;
            basket.style.left = newLeft + 'px';
        });

        // Kâseyi telefonda parmakla hareket ettirme
        gameArea.addEventListener('touchmove', (e) => {
            if (!gameActive) return;
            e.preventDefault(); // Sayfanın kaymasını engeller
            let rect = gameArea.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            let newLeft = touchX - 30;
            if (newLeft < 0) newLeft = 0;
            if (newLeft > gameArea.offsetWidth - 60) newLeft = gameArea.offsetWidth - 60;
            basket.style.left = newLeft + 'px';
        }, { passive: false });

        // Yeni malzeme düşürme fonksiyonu
        function spawnItem() {
            if (!gameActive) return;

            const itemEl = document.createElement('div');
            itemEl.classList.add('item');
            
            // Yüzde 70 ihtimalle iyi malzeme, yüzde 30 kötü malzeme gelsin
            const isGood = Math.random() > 0.3; 
            const itemArray = isGood ? goodItems : badItems;
            const randomItem = itemArray[Math.floor(Math.random() * itemArray.length)];
            
            itemEl.innerText = randomItem;
            itemEl.dataset.isGood = isGood;
            
            // Rastgele yatay konum
            const randomX = Math.floor(Math.random() * (gameArea.offsetWidth - 40));
            itemEl.style.left = randomX + 'px';
            itemEl.style.top = '-40px';
            
            gameArea.appendChild(itemEl);
            fallingItems.push(itemEl);
        }

        // Oyun Döngüsü (Malzemelerin aşağı düşmesi ve çarpışma kontrolü)
        function gameLoop() {
            if (!gameActive) return;

            let basketRect = basket.getBoundingClientRect();

            fallingItems.forEach((item, index) => {
                let currentTop = parseInt(item.style.top);
                let newTop = currentTop + 5; // Düşme hızı
                item.style.top = newTop + 'px';

                let itemRect = item.getBoundingClientRect();

                // Çarpışma (Yakalanma) Kontrolü
                if (
                    itemRect.bottom >= basketRect.top &&
                    itemRect.top <= basketRect.bottom &&
                    itemRect.right >= basketRect.left &&
                    itemRect.left <= basketRect.right
                ) {
                    // Yakalandı!
                    if (item.dataset.isGood === 'true') {
                        score++;
                    } else {
                        score--; // Kötü malzeme yakalarsa eksi puan
                        if (score < 0) score = 0;
                    }
                    scoreBoard.innerText = `Toplanan Malzeme: ${score} / 10`;
                    
                    item.remove();
                    fallingItems.splice(index, 1);

                    // Kazanma Durumu
                    if (score >= 10) {
                        winGame();
                    }
                } 
                // Yere Düşme Kontrolü
                else if (newTop > gameArea.offsetHeight) {
                    item.remove();
                    fallingItems.splice(index, 1);
                }
            });

            requestAnimationFrame(gameLoop);
        }

        function winGame() {
            gameActive = false;
            winScreen.style.display = 'flex';
        }

        // Oyunu Başlat
        setInterval(spawnItem, 1000); // Her 1 saniyede yeni nesne
        requestAnimationFrame(gameLoop); // Animasyon döngüsünü başlat

    </script>
</body>
</html>
